<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 628" width="960" height="628" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">SHADOW-MoE official SKIPP'D test results</title>
<desc id="d">Panel A: CRPS change of G3″-F versus E4-B-fit (overall and ramps) and versus smart persistence (overall and cloudy days), with 95% CIs. Panel B: calibrated 90% interval coverage by stratum versus the 0.87-0.93 target.</desc>
<style>
.bg{fill:#ffffff}.title{fill:#0b0b0b;font-size:15px;font-weight:600}.sub{fill:#52514e;font-size:12px}
