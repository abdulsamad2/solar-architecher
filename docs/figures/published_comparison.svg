<text x="24.0" y="272.0" class="sub" text-anchor="start">Nie et al., Adv. Appl. Energy 2024</text>
<path class="bar-lo" d="M330.0,249.0 H515.7 Q519.7,249.0 519.7,253.0 V263.0 Q519.7,267.0 515.7,267.0 H330.0 Z"/>
<text x="525.7" y="262.5" class="val" text-anchor="start">2.81</text>
<path class="bar-lo" d="M650.0,249.0 H757.2 Q761.2,249.0 761.2,253.0 V263.0 Q761.2,267.0 757.2,267.0 H650.0 Z"/>
<text x="767.2" y="262.5" class="val" text-anchor="start">26.7</text>
<text x="24.0" y="300.0" class="lab" text-anchor="start">SUNSET</text>
<text x="24.0" y="316.0" class="sub" text-anchor="start">Sun et al., Solar Energy 2019 (as published)</text>
<path class="bar-lo" d="M330.0,293.0 H549.4 Q553.4,293.0 553.4,297.0 V307.0 Q553.4,311.0 549.4,311.0 H330.0 Z"/>
<text x="559.4" y="306.5" class="val" text-anchor="start">3.31</text>
<path class="bar-lo" d="M650.0,293.0 H883.3 Q887.3,293.0 887.3,297.0 V307.0 Q887.3,311.0 883.3,311.0 H650.0 Z"/>
<text x="893.3" y="306.5" class="val" text-anchor="start">57.0</text>
<text x="24.0" y="344.0" class="lab" text-anchor="start">Smart persistence</text>
<text x="24.0" y="360.0" class="sub" text-anchor="start">no-skill reference</text>
<path class="bar-lo" d="M330.0,337.0 H573.7 Q577.7,337.0 577.7,341.0 V351.0 Q577.7,355.0 573.7,355.0 H330.0 Z"/>
<text x="583.7" y="350.5" class="val" text-anchor="start">3.67</text>
<text x="656.0" y="350.5" class="valmuted" text-anchor="start">not reported</text>
</svg>
